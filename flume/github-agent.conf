# ==================================================================
#  GitHub Tech Trend Radar - Apache Flume agent
#
#  Do not edit /home/dev / hdfs://localhost:9000 by hand: run ./setup.sh and it
#  creates flume/github-agent.conf with the real values.
#
#  Two flows:
#    archiveSrc : ~/github_spool/archive -> HDFS /github/raw/archive
#    liveSrc    : ~/github_spool/live    -> HDFS /github/raw/live
# ==================================================================

agent.sources  = archiveSrc liveSrc
agent.channels = archiveCh liveCh
agent.sinks    = archiveSink liveSink

# ------------------------- ARCHIVE FLOW ---------------------------
agent.sources.archiveSrc.type = spooldir
agent.sources.archiveSrc.spoolDir = /home/dev/github_spool/archive
agent.sources.archiveSrc.deserializer = LINE
agent.sources.archiveSrc.deserializer.maxLineLength = 20000
agent.sources.archiveSrc.batchSize = 5000
agent.sources.archiveSrc.channels = archiveCh

agent.channels.archiveCh.type = memory
agent.channels.archiveCh.capacity = 200000
agent.channels.archiveCh.transactionCapacity = 10000

agent.sinks.archiveSink.type = hdfs
agent.sinks.archiveSink.channel = archiveCh
agent.sinks.archiveSink.hdfs.path = hdfs://localhost:9000/github/raw/archive
agent.sinks.archiveSink.hdfs.filePrefix = events
agent.sinks.archiveSink.hdfs.fileSuffix = .json
# files still being written start with "_" so Hive/Spark ignore them
agent.sinks.archiveSink.hdfs.inUsePrefix = _
agent.sinks.archiveSink.hdfs.fileType = DataStream
agent.sinks.archiveSink.hdfs.writeFormat = Text
agent.sinks.archiveSink.hdfs.batchSize = 10000
agent.sinks.archiveSink.hdfs.rollInterval = 300
agent.sinks.archiveSink.hdfs.rollSize = 134217728
agent.sinks.archiveSink.hdfs.rollCount = 0
agent.sinks.archiveSink.hdfs.idleTimeout = 60
agent.sinks.archiveSink.hdfs.callTimeout = 60000

# --------------------------- LIVE FLOW ----------------------------
agent.sources.liveSrc.type = spooldir
agent.sources.liveSrc.spoolDir = /home/dev/github_spool/live
agent.sources.liveSrc.deserializer = LINE
agent.sources.liveSrc.deserializer.maxLineLength = 20000
agent.sources.liveSrc.batchSize = 500
agent.sources.liveSrc.channels = liveCh

agent.channels.liveCh.type = memory
agent.channels.liveCh.capacity = 20000
agent.channels.liveCh.transactionCapacity = 1000

agent.sinks.liveSink.type = hdfs
agent.sinks.liveSink.channel = liveCh
agent.sinks.liveSink.hdfs.path = hdfs://localhost:9000/github/raw/live
agent.sinks.liveSink.hdfs.filePrefix = live
agent.sinks.liveSink.hdfs.fileSuffix = .json
agent.sinks.liveSink.hdfs.inUsePrefix = _
agent.sinks.liveSink.hdfs.fileType = DataStream
agent.sinks.liveSink.hdfs.writeFormat = Text
agent.sinks.liveSink.hdfs.batchSize = 1000
# roll every minute so Spark Streaming sees new data quickly
agent.sinks.liveSink.hdfs.rollInterval = 60
agent.sinks.liveSink.hdfs.rollSize = 0
agent.sinks.liveSink.hdfs.rollCount = 0
agent.sinks.liveSink.hdfs.idleTimeout = 30
agent.sinks.liveSink.hdfs.callTimeout = 60000
